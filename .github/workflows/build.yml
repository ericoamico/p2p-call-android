name: Build APK

# A cada push (qualquer branch) compila e testa o APK e o publica como artefato.
# Na main também cria uma release v1.0.<run> com o P2PCall.apk, usada pelo atualizador do app.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Opcional: chave de assinatura própria nos secrets (senão usa app/release.keystore).
      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.P2PCALL_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "P2PCALL_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "P2PCALL_KEYSTORE_PASSWORD=${{ secrets.P2PCALL_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "P2PCALL_KEY_ALIAS=${{ secrets.P2PCALL_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "P2PCALL_KEY_PASSWORD=${{ secrets.P2PCALL_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Testar e compilar
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testReleaseUnitTest assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon 2>&1 | tee build.log

      # Mostra os erros de compilação como anotações do workflow.
      - name: Resumo dos erros
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR:|What went wrong|Missing class|FAILED" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk P2PCall.apk

      - uses: actions/upload-artifact@v4
        with:
          name: P2PCall-apk
          path: P2PCall.apk

      - name: Criar release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          msg=$(git log -1 --pretty=%s)
          gh release create "$tag" P2PCall.apk \
            --target "${{ github.sha }}" \
            --title "P2P Call Android $tag" \
            --notes "Build automática do commit ${{ github.sha }}: $msg" \
            --latest
